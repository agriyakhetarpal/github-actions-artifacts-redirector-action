name: Build test artifact for previewing

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create a test artifact
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist_artifacts
          envsubst '$COMMIT_SHA' < test_artifacts/preview.html > dist_artifacts/preview.html
          echo "Simulating a long artifact build... but not too long :D"
          sleep 10

      - name: Upload the test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist_artifacts/preview.html
          archive: false
          retention-days: 14
